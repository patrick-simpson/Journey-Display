<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Display</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="checkin-view" class="view">
    <iframe
      src="https://patrick-simpson.github.io/Awana-Check-in-Display/"
      title="Awana Check-in Display"
      allow="fullscreen"
    ></iframe>
  </div>

  <div id="journey-view" class="view hidden">
    <span>Journey</span>
  </div>

  <button id="toggle-btn" type="button" aria-label="Switch display"></button>

  <script src="src/schedule.js"></script>
</body>
</html>
