<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Display</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="checkin-view" class="view">
    <iframe
      src="https://patrick-simpson.github.io/Awana-Check-in-Display/?lowPower=1"
      title="Awana Check-in Display"
      allow="fullscreen"
    ></iframe>
  </div>

  <div id="journey-view" class="view hidden">
    <div id="journey-placeholder">
      <span>Journey</span>
    </div>
    <!-- Splash composition follows the Advocates videos' own title cards:
         the lesson's topic word alone as the hero, everything else demoted
         to quiet metadata. See style.css for the palette's provenance. -->
    <div id="journey-splash" class="hidden">
      <div id="journey-splash-mark">
        <span>Journey</span>
        <span id="journey-splash-course">Advocates</span>
      </div>

      <div id="journey-splash-body">
        <p id="journey-splash-eyebrow">Large Group Time</p>
        <h1 id="journey-splash-topic"></h1>
        <p id="journey-splash-meta">
          <span id="journey-splash-week"></span>
          <span id="journey-splash-ref"></span>
        </p>

        <div id="journey-splash-action">
          <button id="journey-splash-play-btn" type="button">Begin Video</button>
          <span id="journey-splash-hint">Press Space or &rarr;</span>
        </div>
      </div>
    </div>
    <video id="journey-video" class="hidden" muted playsinline></video>
    <button id="unmute-btn" type="button" class="hidden" aria-label="Unmute">🔇</button>
  </div>

  <button id="toggle-btn" type="button" aria-label="Switch display">⇄</button>
  <button id="settings-btn" type="button" aria-label="Video settings">⚙</button>

  <div id="settings-panel" class="hidden" role="dialog" aria-label="Journey video settings" aria-modal="true">
    <div id="settings-backdrop"></div>
    <div id="settings-card">
      <div id="settings-header">
        <h2>Journey Videos</h2>
        <button id="settings-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <p id="settings-preview-note">
        Picking a video here plays it once, right now — it never changes what
        automatically plays at 6:30&nbsp;PM.
      </p>
      <div id="settings-lesson-list" role="listbox" aria-label="Choose a lesson"></div>
      <div id="settings-variant-picker" class="hidden">
        <p id="settings-variant-prompt"></p>
        <div id="settings-variant-buttons">
          <button id="settings-variant-student" type="button">Student Video</button>
          <button id="settings-variant-leader" type="button">Leader Video</button>
        </div>
        <button id="settings-variant-back" type="button">← Back to list</button>
      </div>
    </div>
  </div>

  <script src="src/schedule.js"></script>
</body>
</html>
